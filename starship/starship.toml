"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 900
scan_timeout = 25

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_status\
$git_metrics\
$git_state\
$python\
$nodejs\
$rust\
$golang\
$deno\
$docker_context\
$line_break\
$battery\
$cmd_duration\
$jobs\
$container\
$status\
$sudo\
$character"""

palette = "macchiato"

[palettes.macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"

[character]
success_symbol = "[❱](bold lavender)"
error_symbol = "[❱](bold red)"
vimcmd_symbol = "[❰](bold mauve)"
vimcmd_visual_symbol = "[❰](bold pink)"
vimcmd_replace_symbol = "[❰](bold maroon)"
vimcmd_replace_one_symbol = "[❰](bold maroon)"

[username]
show_always = false
style_user = "fg:sapphire"
style_root = "bold fg:red"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "fg:sapphire"
format = "[@$hostname]($style) "

[directory]
style = "bold fg:text"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
before_repo_root_style = "fg:overlay1"
repo_root_style = "bold fg:text"
repo_root_format = "[ ](fg:overlay1)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "fg:red"
home_symbol = "~"

[git_branch]
symbol = " "
style = "bold fg:mauve"
format = "[$symbol$branch]($style) "
truncation_length = 32
truncation_symbol = "…"
only_attached = true

[git_commit]
style = "bold fg:mauve"
format = "[ $hash$tag]($style) "
only_detached = true
tag_disabled = false
tag_symbol = "  "

[git_status]
style = "fg:red"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_metrics]
disabled = false
ignore_submodules = true
added_style = "fg:green"
deleted_style = "fg:red"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

[git_state]
style = "fg:maroon"
format = '([$state( $progress_current/$progress_total)]($style) )'

[python]
symbol = " "
style = "fg:yellow"
format = '[$symbol$version( ($virtualenv))]($style) '
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", ".python-version", "uv.lock"]

[nodejs]
symbol = "󰎙 "
style = "fg:green"
format = '[$symbol$version]($style) '
detect_files = ["package.json", ".node-version", "pnpm-lock.yaml", "yarn.lock", "package-lock.json"]

[rust]
symbol = " "
style = "fg:peach"
format = '[$symbol$version]($style) '
detect_extensions = ["rs"]

[golang]
symbol = " "
style = "fg:blue"
format = '[$symbol$version]($style) '
detect_extensions = ["go"]

[deno]
symbol = " "
style = "fg:teal"
format = '[$symbol$version]($style) '

[docker_context]
symbol = " "
style = "fg:sapphire"
format = '[$symbol$context]($style) '
only_with_files = false
detect_files = ["docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml", "Dockerfile"]

[battery]
format = "[$symbol$percentage]($style) "
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 20
style = "bold fg:red"

[cmd_duration]
min_time = 1200
show_milliseconds = false
style = "fg:rosewater"
format = "[󱎫 $duration]($style) "

[jobs]
symbol = "󰣖 "
style = "fg:pink"
number_threshold = 1
format = "[$symbol$number]($style) "

[container]
format = "[$symbol $name]($style) "
symbol = "⬢"
style = "fg:sky"

[status]
disabled = false
symbol = "✘ "
style = "fg:red"
format = "[$symbol$status( $signal_name)]($style) "

[sudo]
disabled = false
symbol = "󰌿 "
style = "fg:red"
format = "[$symbol]($style)"
