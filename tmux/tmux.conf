# set -g default-command "/bin/zsh -l"

# Mouse support, including wheel scroll in tmux panes.
set -g mouse on
set-window-option -g mode-keys vi
set -s escape-time 10
set -s focus-events on
set -g history-limit 50000
set -g set-titles on
set -g display-time 1000
set -s set-clipboard on
# Headless/SSH hosts have no Wayland; copies there go through OSC52 only.
if-shell '[ -n "$WAYLAND_DISPLAY" ]' 'set -s copy-command "wl-copy"'

set -g monitor-activity on
set -g visual-activity off
# Bells in other windows show as a red window name instead of a message.
set -g bell-action other
set -g visual-bell off

set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features ',xterm*:extkeys,tmux*:extkeys,screen*:extkeys'

unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "#[fg=#a6da95]✓ #[fg=#cad3f5]config reloaded"
bind-key S command-prompt -p "new session:" "new-session -s '%%'"

# Mouse selection copies to the local clipboard without leaving copy-mode.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe
bind-key -T copy-mode-vi C-j send-keys -X copy-pipe
bind-key -T copy-mode-vi Escape send-keys -X clear-selection
bind-key -T copy-mode v send-keys -X begin-selection
bind-key -T copy-mode y send-keys -X copy-pipe
bind-key -T copy-mode Enter send-keys -X copy-pipe
bind-key -T copy-mode C-j send-keys -X copy-pipe
bind-key -T copy-mode Escape send-keys -X clear-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe
bind-key -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe
bind-key -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe
bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe"
bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe"

# Zellij-like pane navigation.
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
bind-key -n C-M-h resize-pane -L 5
bind-key -n C-M-j resize-pane -D 2
bind-key -n C-M-k resize-pane -U 2
bind-key -n C-M-l resize-pane -R 5

# Explicit pane splits in the current working directory.
bind-key -n M-r split-window -h -c "#{pane_current_path}"
bind-key -n M-d split-window -v -c "#{pane_current_path}"
bind-key -n M-z resize-pane -Z
bind-key -n M-t new-window -c "#{pane_current_path}"
bind-key -n M-i previous-window
bind-key -n M-o next-window
bind-key -n C-M-w confirm-before -p "kill window #W? (y/n)" kill-window
bind-key q confirm-before -p "kill session #S? (y/n)" kill-session

# Make tmux windows behave more like tabs.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9

# Session picker: existing sessions, then zoxide/project dirs (new session on pick).
bind-key -n M-s display-popup -E -w 60% -h 50% -T " sessions " "~/.local/bin/tmux-sessionizer"

# UI: Catppuccin Macchiato, matching Ghostty.
#   crust #181926  mantle #1e2030  surface0 #363a4f  overlay #6e738d
#   subtext #a5adcb  text #cad3f5  mauve #c6a0f6  yellow #eed49f  green #a6da95  peach #f5a97f  red #ed8796

# Panes
set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#c6a0f6"
set -g display-panes-colour "#6e738d"
set -g display-panes-active-colour "#c6a0f6"
set -g display-panes-border-style "fg=#363a4f"
set -g pane-scrollbars-style "bg=#1e2030,fg=#6e738d,width=1,pad=0"

# Status bar
#   left  : Arch icon, session (yellow block while prefix is held)
#   centre: windows as number block + name (current: mauve block; name red on bell, yellow on activity)
#   right : copy-mode indicator, date, time, hostname (SSH only)
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify absolute-centre
set -g status-style "bg=#181926,fg=#cad3f5"
set -g status-left-length 40
set -g status-left " #{?client_prefix,#[fg=#eed49f],#[fg=#c6a0f6]} #{?client_prefix,#[bg=#eed49f#,fg=#181926],#[fg=#c6a0f6]}#[bold] #S #[default] "
set -g status-right-length 80
set -g status-right "#{?pane_in_mode,#[fg=#eed49f]COPY  ,}#[fg=#6e738d]%m/%d %H:%M "
if-shell '[ -n "$SSH_CONNECTION" ]' \
    'set -ga status-right " #[fg=#c6a0f6,bold]󰒋 #h "'
set -g window-status-separator ""
set -g window-status-format "#[bg=#363a4f,fg=#a5adcb] #I #[default] #{?window_bell_flag,#[fg=#ed8796],#{?window_activity_flag,#[fg=#eed49f],#[fg=#a5adcb]}}#W#{?window_zoomed_flag,#[fg=#6e738d] 󰁌,} "
set -g window-status-current-format "#[bg=#c6a0f6,fg=#181926,bold] #I #[default] #[fg=#cad3f5,bold]#W#{?window_zoomed_flag,#[fg=#eed49f] 󰁌,} "
# tmux 3.8 underlines the current window/pane/session by default.
set -g window-status-current-style "default"
set -g pane-status-current-style "default"
set -g session-status-current-style "default"
set -g window-status-activity-style "none"
set -g window-status-bell-style "none"

# Messages, prompts, menus, popups
set -g message-style "bg=#363a4f,fg=#cad3f5,fill=#363a4f"
set -g message-command-style "bg=#363a4f,fg=#c6a0f6,fill=#363a4f"
set -g menu-style "bg=#1e2030,fg=#cad3f5"
set -g menu-selected-style "bg=#363a4f,fg=#c6a0f6,bold"
set -g menu-border-style "fg=#363a4f"
set -g menu-border-lines rounded
set -g popup-style "bg=default"
set -g popup-border-style "fg=#c6a0f6"
set -g popup-border-lines rounded

# Copy mode
set -g mode-style "bg=#363a4f,fg=#cad3f5"
set -g copy-mode-match-style "bg=#363a4f,fg=#eed49f"
set -g copy-mode-current-match-style "bg=#f5a97f,fg=#181926"
set -g copy-mode-mark-style "bg=#eed49f,fg=#181926"
set -g copy-mode-line-number-style "fg=#6e738d"
set -g copy-mode-current-line-number-style "fg=#eed49f"
set -g clock-mode-colour "#c6a0f6"

# Tree mode (prefix s / w): replaces tmux 3.8's default grey theme colours.
#   preview labels: mauve for the active window/pane, text otherwise
set -g tree-mode-border-style "fg=#6e738d"
set -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#c6a0f6,#cad3f5}"
set -g switch-mode-match-style "bg=#363a4f,fg=#eed49f"
